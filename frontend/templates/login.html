<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分拣下料单元 · MES 登录</title>
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}?v=1">
</head>
<body>

<div class="orb a"></div>
<div class="orb b"></div>
<canvas id="scene"></canvas>

<!-- 左下:六轴机器人线框,悬停关节可高亮并显示轴名;夹爪处有脉冲物料 -->
<svg id="robot" viewBox="0 0 420 420" fill="none">
  <!-- 底座 -->
  <g class="part">
    <ellipse class="st" cx="150" cy="395" rx="74" ry="13"/>
    <rect class="st" x="118" y="338" width="64" height="52" rx="8"/>
    <circle class="dot" cx="150" cy="338" r="10"/>
    <text class="lbl" x="238" y="400">J1 · 基座旋转</text>
  </g>
  <!-- 大臂 + 肘部(整体轻微摆动,模拟待机伺服) -->
  <g class="part arm2">
    <line class="st" x1="150" y1="338" x2="212" y2="212" stroke-width="15"/>
    <circle class="dot" cx="212" cy="212" r="10"/>
    <line class="st" x1="212" y1="212" x2="278" y2="146" stroke-width="11"/>
    <text class="lbl" x="248" y="232">J2/J3 · 大臂 / 肘</text>
  </g>
  <!-- 腕部 + 末端夹爪(夹着一件发光物料) -->
  <g class="part wrist">
    <circle class="dot" cx="278" cy="146" r="9"/>
    <line class="st" x1="278" y1="146" x2="304" y2="122"/>
    <line class="st" x1="304" y1="122" x2="322" y2="104"/>
    <line class="st" x1="296" y1="106" x2="314" y2="124"/>
    <line class="st" x1="318" y1="112" x2="330" y2="100"/>
    <rect class="cube" x="322" y="80" width="24" height="24" rx="5"/>
    <text class="lbl" x="286" y="76">J4-J6 · 腕 / 夹爪</text>
  </g>
</svg>

<!-- 网页左上角:校名 logo 图片 -->
<img class="corner-logo" src="{{ url_for('static', filename='images/logo20260319.png') }}" alt="深圳信息职业技术大学">

<!-- 左侧品牌区 -->
<div class="brand">
  <h1>分拣下料单元</h1>
  <p class="sub">UNLOADING STATION · MES</p>
  <div class="bar"></div>
  <div class="chips">
    <span class="chip"><span class="dot-ok"></span>系统在线</span>
    <span class="chip">分拣下料单元 · ST-01</span>
    <span class="chip">AUBO × S7-1200</span>
    <span class="chip">Modbus TCP</span>
  </div>
</div>

<!-- 登录卡片 -->
<div class="panel-wrap">
  <div class="panel">
    <div class="panel-head">
      <img class="logo" src="{{ url_for('static', filename='images/yk_logo.png') }}" alt="YK 分拣下料单元" width="42" height="42">
      <div>
        <h2>分拣下料单元</h2>
        <p>UNLOADING STATION · MES SYSTEM</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="mainTab" type="button">登 录</button>
      <span class="tab-ink" id="tabInk"></span>
    </div>

    <!-- 提示条:错误红 / 成功绿。服务端带来的提示(比如登录已失效)会直接填在这里 -->
    <div class="alert{% if flash_msg %} {{ 'err' if flash_err else 'succ' }}{% endif %}" id="alert">{{ flash_msg or '' }}</div>

    <!-- 登录面板 -->
    <form id="loginForm" class="pane active" autocomplete="off" novalidate>
      <label class="field">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-3.6 3.8-5.4 7-5.4s5.8 1.8 7 5.4"/>
        </svg>
        <input id="loginUser" placeholder="工号 / 邮箱" maxlength="64">
      </label>
      <label class="field">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
          <rect x="5" y="10.5" width="14" height="9" rx="2.2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>
        </svg>
        <input id="loginPass" type="password" placeholder="密码" maxlength="32">
        <button class="eye" type="button" data-eye="loginPass" title="显示 / 隐藏密码">
          <svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </label>
      <div class="row">
        <span style="display:flex; gap:14px; margin-left:auto">
          <a class="link" id="toReset">忘记密码?</a>
          <a class="link" id="toRegister">立即注册</a>
        </span>
      </div>
      <button class="btn" type="submit" id="loginBtn">登 录 系 统</button>
    </form>

    <!-- 注册面板(工号由系统分配,用户无需也不能填写) -->
    <form id="regForm" class="pane" autocomplete="off" novalidate>
      <label class="field">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
          <rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M4 7l8 6 8-6"/>
        </svg>
        <input id="regEmail" placeholder="邮箱" maxlength="60">
      </label>
      <label class="field">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
          <rect x="5" y="10.5" width="14" height="9" rx="2.2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>
        </svg>
        <input id="regPass" type="password" placeholder="密码(≥8 位,含字母和数字)" maxlength="32">
      </label>
      <div class="pwbar" id="pwbar"><i></i><i></i><i></i><i></i></div>
      <label class="field">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
          <rect x="5" y="10.5" width="14" height="9" rx="2.2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/><path d="M9.5 15l1.8 1.8L15 13.5"/>
        </svg>
        <input id="regPass2" type="password" placeholder="确认密码" maxlength="32">
      </label>
      <label class="field">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
          <rect x="4" y="9.5" width="16" height="10" rx="2"/><path d="M8 9.5V7a4 4 0 0 1 8 0v2.5"/>
        </svg>
        <input id="regCode" placeholder="验证码" maxlength="6">
        <button class="code-btn" type="button" id="regSendBtn">获取验证码</button>
      </label>
      <label class="field">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
          <rect x="4" y="4.5" width="16" height="15" rx="2.5"/><path d="M9 9.5h6M9 13.5h3"/>
        </svg>
        <input id="regInvite" placeholder="邀请码(可选)" maxlength="16">
      </label>
      <button class="btn" type="submit" id="regBtn">注 册 并 登 录</button>
      <a class="link center" id="toLogin">已有账号?返回登录</a>
    </form>

    <!-- 忘记密码面板(邮箱验证码重置) -->
    <form id="resetForm" class="pane" autocomplete="off" novalidate>
      <label class="field">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
          <rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M4 7l8 6 8-6"/>
        </svg>
        <input id="resetEmail" placeholder="注册时填写的邮箱" maxlength="60">
      </label>
      <label class="field">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
          <rect x="4" y="9.5" width="16" height="10" rx="2"/><path d="M8 9.5V7a4 4 0 0 1 8 0v2.5"/>
        </svg>
        <input id="resetCode" placeholder="邮箱验证码(6 位)" maxlength="6">
        <button class="code-btn" type="button" id="resetSendBtn">获取验证码</button>
      </label>
      <label class="field">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
          <rect x="5" y="10.5" width="14" height="9" rx="2.2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>
        </svg>
        <input id="resetPass" type="password" placeholder="新密码(≥8 位,含字母和数字)" maxlength="32">
        <button class="eye" type="button" data-eye="resetPass" title="显示 / 隐藏密码">
          <svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </label>
      <label class="field">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
          <rect x="5" y="10.5" width="14" height="9" rx="2.2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/><path d="M9.5 15l1.8 1.8L15 13.5"/>
        </svg>
        <input id="resetPass2" type="password" placeholder="确认新密码" maxlength="32">
      </label>
      <div class="role-note">重置后其它地方的登录会立即失效,需要用新密码重新登录。<br>
        没有绑定邮箱的账号,请联系管理员在「人员管理」里重置密码。</div>
      <button class="btn" type="submit" id="resetBtn">重 置 密 码</button>
      <a class="link center" id="resetToLogin">想起密码了?返回登录</a>
    </form>

    <div class="panel-foot">© 2026 分拣下料单元 · 数据采集系统 v0.2 · 内部系统</div>
  </div>
</div>

<script src="{{ url_for('static', filename='login.js') }}?v=1"></script>
</body>
</html>
